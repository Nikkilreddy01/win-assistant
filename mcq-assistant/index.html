<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCQ Assistant</title>
  <meta name="description" content="MCQ Assistant - visual answer indicator that moves to screen corners" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a26;
      --border: #2a2a3a;
      --text-primary: #e8e8f0;
      --text-secondary: #8888a0;
      --accent-a: #6c5ce7;
      --accent-b: #00cec9;
      --accent-c: #fd79a8;
      --accent-d: #fdcb6e;
      --glow-a: rgba(108, 92, 231, 0.5);
      --glow-b: rgba(0, 206, 201, 0.5);
      --glow-c: rgba(253, 121, 168, 0.5);
      --glow-d: rgba(253, 203, 110, 0.5);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* Corner indicators */
    .corner-indicator {
      position: fixed;
      width: 80px;
      height: 80px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      opacity: 0.15;
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 100;
      pointer-events: none;
      backdrop-filter: blur(10px);
    }

    .corner-indicator.active {
      opacity: 1;
      transform: scale(1.3);
    }

    #corner-a {
      top: 20px;
      left: 20px;
      background: linear-gradient(135deg, var(--accent-a), #a29bfe);
      color: white;
      box-shadow: 0 0 0px var(--glow-a);
    }
    #corner-a.active {
      box-shadow: 0 0 40px var(--glow-a), 0 0 80px var(--glow-a);
      animation: pulse-a 1.5s ease-in-out infinite;
    }

    #corner-b {
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, var(--accent-b), #55efc4);
      color: white;
      box-shadow: 0 0 0px var(--glow-b);
    }
    #corner-b.active {
      box-shadow: 0 0 40px var(--glow-b), 0 0 80px var(--glow-b);
      animation: pulse-b 1.5s ease-in-out infinite;
    }

    #corner-c {
      bottom: 20px;
      left: 20px;
      background: linear-gradient(135deg, var(--accent-c), #fab1a0);
      color: white;
      box-shadow: 0 0 0px var(--glow-c);
    }
    #corner-c.active {
      box-shadow: 0 0 40px var(--glow-c), 0 0 80px var(--glow-c);
      animation: pulse-c 1.5s ease-in-out infinite;
    }

    #corner-d {
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, var(--accent-d), #ffeaa7);
      color: #333;
      box-shadow: 0 0 0px var(--glow-d);
    }
    #corner-d.active {
      box-shadow: 0 0 40px var(--glow-d), 0 0 80px var(--glow-d);
      animation: pulse-d 1.5s ease-in-out infinite;
    }

    @keyframes pulse-a {
      0%, 100% { box-shadow: 0 0 40px var(--glow-a), 0 0 80px var(--glow-a); transform: scale(1.3); }
      50% { box-shadow: 0 0 60px var(--glow-a), 0 0 120px var(--glow-a); transform: scale(1.4); }
    }
    @keyframes pulse-b {
      0%, 100% { box-shadow: 0 0 40px var(--glow-b), 0 0 80px var(--glow-b); transform: scale(1.3); }
      50% { box-shadow: 0 0 60px var(--glow-b), 0 0 120px var(--glow-b); transform: scale(1.4); }
    }
    @keyframes pulse-c {
      0%, 100% { box-shadow: 0 0 40px var(--glow-c), 0 0 80px var(--glow-c); transform: scale(1.3); }
      50% { box-shadow: 0 0 60px var(--glow-c), 0 0 120px var(--glow-c); transform: scale(1.4); }
    }
    @keyframes pulse-d {
      0%, 100% { box-shadow: 0 0 40px var(--glow-d), 0 0 80px var(--glow-d); transform: scale(1.3); }
      50% { box-shadow: 0 0 60px var(--glow-d), 0 0 120px var(--glow-d); transform: scale(1.4); }
    }

    /* Floating ball indicator */
    .floating-ball {
      position: fixed;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: white;
      z-index: 200;
      pointer-events: none;
      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      opacity: 0;
      filter: blur(0px);
    }

    .floating-ball.visible {
      opacity: 1;
    }

    .floating-ball.pos-a {
      top: 40px;
      left: 40px;
      background: var(--accent-a);
      box-shadow: 0 0 30px var(--glow-a), 0 0 60px var(--glow-a);
    }
    .floating-ball.pos-b {
      top: 40px;
      right: 40px;
      left: auto;
      background: var(--accent-b);
      box-shadow: 0 0 30px var(--glow-b), 0 0 60px var(--glow-b);
    }
    .floating-ball.pos-c {
      bottom: 40px;
      top: auto;
      left: 40px;
      background: var(--accent-c);
      box-shadow: 0 0 30px var(--glow-c), 0 0 60px var(--glow-c);
    }
    .floating-ball.pos-d {
      bottom: 40px;
      top: auto;
      right: 40px;
      left: auto;
      background: var(--accent-d);
      box-shadow: 0 0 30px var(--glow-d), 0 0 60px var(--glow-d);
    }
    .floating-ball.pos-center {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #555;
      box-shadow: none;
      opacity: 0.3;
    }

    /* Main content */
    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #6c5ce7, #00cec9, #fd79a8, #fdcb6e);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 4s ease infinite;
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .header p {
      color: var(--text-secondary);
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    /* Option buttons */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      max-width: 500px;
      width: 100%;
    }

    .option-btn {
      position: relative;
      padding: 1.5rem 2rem;
      border: 2px solid var(--border);
      border-radius: 16px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      display: flex;
      align-items: center;
      gap: 0.8rem;
      overflow: hidden;
    }

    .option-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 14px;
    }

    .option-btn .key-badge {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .option-btn .label {
      position: relative;
      z-index: 1;
    }

    .option-btn .shortcut {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-secondary);
      background: rgba(255,255,255,0.05);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-weight: 500;
      position: relative;
      z-index: 1;
    }

    /* Option A */
    #btn-a { border-color: rgba(108, 92, 231, 0.3); }
    #btn-a::before { background: linear-gradient(135deg, rgba(108,92,231,0.1), transparent); }
    #btn-a .key-badge { background: var(--accent-a); color: white; }
    #btn-a:hover, #btn-a.selected {
      border-color: var(--accent-a);
      box-shadow: 0 0 30px var(--glow-a);
      transform: translateY(-2px);
    }
    #btn-a:hover::before, #btn-a.selected::before { opacity: 1; }

    /* Option B */
    #btn-b { border-color: rgba(0, 206, 201, 0.3); }
    #btn-b::before { background: linear-gradient(135deg, rgba(0,206,201,0.1), transparent); }
    #btn-b .key-badge { background: var(--accent-b); color: white; }
    #btn-b:hover, #btn-b.selected {
      border-color: var(--accent-b);
      box-shadow: 0 0 30px var(--glow-b);
      transform: translateY(-2px);
    }
    #btn-b:hover::before, #btn-b.selected::before { opacity: 1; }

    /* Option C */
    #btn-c { border-color: rgba(253, 121, 168, 0.3); }
    #btn-c::before { background: linear-gradient(135deg, rgba(253,121,168,0.1), transparent); }
    #btn-c .key-badge { background: var(--accent-c); color: white; }
    #btn-c:hover, #btn-c.selected {
      border-color: var(--accent-c);
      box-shadow: 0 0 30px var(--glow-c);
      transform: translateY(-2px);
    }
    #btn-c:hover::before, #btn-c.selected::before { opacity: 1; }

    /* Option D */
    #btn-d { border-color: rgba(253, 203, 110, 0.3); }
    #btn-d::before { background: linear-gradient(135deg, rgba(253,203,110,0.1), transparent); }
    #btn-d .key-badge { background: var(--accent-d); color: #333; }
    #btn-d:hover, #btn-d.selected {
      border-color: var(--accent-d);
      box-shadow: 0 0 30px var(--glow-d);
      transform: translateY(-2px);
    }
    #btn-d:hover::before, #btn-d.selected::before { opacity: 1; }

    /* Corner labels */
    .corner-label {
      position: fixed;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.4;
      z-index: 99;
      pointer-events: none;
    }
    .corner-label.tl { top: 108px; left: 24px; }
    .corner-label.tr { top: 108px; right: 24px; }
    .corner-label.bl { bottom: 108px; left: 24px; }
    .corner-label.br { bottom: 108px; right: 24px; }

    /* Status bar */
    .status-bar {
      margin-top: 2rem;
      padding: 0.8rem 1.8rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      transition: all 0.3s ease;
    }

    .status-bar.active {
      border-color: var(--accent-a);
      color: var(--text-primary);
    }

    .status-bar .answer-text {
      font-weight: 700;
      transition: color 0.3s ease;
    }

    /* Reset button */
    .reset-btn {
      margin-top: 1rem;
      padding: 0.6rem 1.5rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-secondary);
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .reset-btn:hover {
      border-color: #ff6b6b;
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
    }

    /* Trail effect */
    .trail-dot {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 150;
      animation: trail-fade 0.6s ease forwards;
    }

    @keyframes trail-fade {
      0% { opacity: 0.8; transform: scale(1); }
      100% { opacity: 0; transform: scale(0); }
    }

    /* Direction arrows */
    .direction-hint {
      position: fixed;
      font-size: 1.5rem;
      opacity: 0;
      z-index: 150;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .direction-hint.show {
      opacity: 0.6;
      animation: arrow-bounce 1s ease-in-out infinite;
    }

    .direction-hint.tl { top: 50%; left: 50%; transform: translate(-200%, -200%) rotate(-45deg); }
    .direction-hint.tr { top: 50%; right: 50%; transform: translate(200%, -200%) rotate(45deg); }
    .direction-hint.bl { bottom: 50%; left: 50%; transform: translate(-200%, 200%) rotate(-135deg); }
    .direction-hint.br { bottom: 50%; right: 50%; transform: translate(200%, 200%) rotate(135deg); }

    @keyframes arrow-bounce {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <!-- Corner Indicators -->
  <div class="corner-indicator" id="corner-a">A</div>
  <div class="corner-indicator" id="corner-b">B</div>
  <div class="corner-indicator" id="corner-c">C</div>
  <div class="corner-indicator" id="corner-d">D</div>

  <!-- Corner Labels -->
  <div class="corner-label tl">↖ Option A</div>
  <div class="corner-label tr">Option B ↗</div>
  <div class="corner-label bl">↙ Option C</div>
  <div class="corner-label br">Option D ↘</div>

  <!-- Floating Ball -->
  <div class="floating-ball" id="floating-ball"></div>

  <!-- Main Content -->
  <div class="main-container">
    <div class="header">
      <h1>MCQ Assistant</h1>
      <p>Press A, B, C, or D — indicator flies to the corner</p>
    </div>

    <div class="options-grid">
      <button class="option-btn" id="btn-a" onclick="selectOption('a')">
        <span class="key-badge">A</span>
        <span class="label">Option A</span>
        <span class="shortcut">↖ Top Left</span>
      </button>
      <button class="option-btn" id="btn-b" onclick="selectOption('b')">
        <span class="key-badge">B</span>
        <span class="label">Option B</span>
        <span class="shortcut">↗ Top Right</span>
      </button>
      <button class="option-btn" id="btn-c" onclick="selectOption('c')">
        <span class="key-badge">C</span>
        <span class="label">Option C</span>
        <span class="shortcut">↙ Bottom Left</span>
      </button>
      <button class="option-btn" id="btn-d" onclick="selectOption('d')">
        <span class="key-badge">D</span>
        <span class="label">Option D</span>
        <span class="shortcut">↘ Bottom Right</span>
      </button>
    </div>

    <div class="status-bar" id="status-bar">
      Press <strong>A</strong>, <strong>B</strong>, <strong>C</strong>, or <strong>D</strong> to select &nbsp;|&nbsp; <strong>R</strong> to reset
    </div>

    <button class="reset-btn" id="reset-btn" onclick="resetSelection()">Reset (R)</button>
  </div>

  <script>
    const ball = document.getElementById('floating-ball');
    const statusBar = document.getElementById('status-bar');
    const corners = {
      a: document.getElementById('corner-a'),
      b: document.getElementById('corner-b'),
      c: document.getElementById('corner-c'),
      d: document.getElementById('corner-d'),
    };
    const buttons = {
      a: document.getElementById('btn-a'),
      b: document.getElementById('btn-b'),
      c: document.getElementById('btn-c'),
      d: document.getElementById('btn-d'),
    };

    const colorMap = {
      a: 'var(--accent-a)',
      b: 'var(--accent-b)',
      c: 'var(--accent-c)',
      d: 'var(--accent-d)',
    };

    const labelMap = {
      a: 'A — Top Left ↖',
      b: 'B — Top Right ↗',
      c: 'C — Bottom Left ↙',
      d: 'D — Bottom Right ↘',
    };

    let currentSelection = null;

    function selectOption(option) {
      // Clear previous
      Object.values(corners).forEach(c => c.classList.remove('active'));
      Object.values(buttons).forEach(b => b.classList.remove('selected'));

      // Set new
      currentSelection = option;
      corners[option].classList.add('active');
      buttons[option].classList.add('selected');

      // Move ball
      ball.className = 'floating-ball visible pos-' + option;

      // Create trail
      createTrail(option);

      // Update status
      statusBar.classList.add('active');
      statusBar.innerHTML = `Selected: <span class="answer-text" style="color: ${colorMap[option]}">${labelMap[option]}</span> &nbsp;|&nbsp; Press <strong>R</strong> to reset`;

      // Screen flash
      screenFlash(option);
    }

    function resetSelection() {
      currentSelection = null;
      Object.values(corners).forEach(c => c.classList.remove('active'));
      Object.values(buttons).forEach(b => b.classList.remove('selected'));
      ball.className = 'floating-ball';
      statusBar.classList.remove('active');
      statusBar.innerHTML = 'Press <strong>A</strong>, <strong>B</strong>, <strong>C</strong>, or <strong>D</strong> to select &nbsp;|&nbsp; <strong>R</strong> to reset';
    }

    function createTrail(option) {
      const colors = {
        a: '#6c5ce7',
        b: '#00cec9',
        c: '#fd79a8',
        d: '#fdcb6e',
      };

      const targets = {
        a: { x: 60, y: 60 },
        b: { x: window.innerWidth - 60, y: 60 },
        c: { x: 60, y: window.innerHeight - 60 },
        d: { x: window.innerWidth - 60, y: window.innerHeight - 60 },
      };

      const center = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      const target = targets[option];
      const steps = 8;

      for (let i = 0; i < steps; i++) {
        const dot = document.createElement('div');
        dot.className = 'trail-dot';
        const progress = i / steps;
        dot.style.left = (center.x + (target.x - center.x) * progress) + 'px';
        dot.style.top = (center.y + (target.y - center.y) * progress) + 'px';
        dot.style.background = colors[option];
        dot.style.animationDelay = (i * 0.05) + 's';
        document.body.appendChild(dot);

        setTimeout(() => dot.remove(), 800);
      }
    }

    function screenFlash(option) {
      const flash = document.createElement('div');
      flash.style.cssText = `
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        opacity: 0.08;
        animation: flash-out 0.5s ease forwards;
      `;

      const gradients = {
        a: 'radial-gradient(circle at top left, var(--accent-a), transparent 60%)',
        b: 'radial-gradient(circle at top right, var(--accent-b), transparent 60%)',
        c: 'radial-gradient(circle at bottom left, var(--accent-c), transparent 60%)',
        d: 'radial-gradient(circle at bottom right, var(--accent-d), transparent 60%)',
      };

      flash.style.background = gradients[option];
      document.body.appendChild(flash);

      setTimeout(() => flash.remove(), 600);

      // Add flash keyframe if not exists
      if (!document.getElementById('flash-style')) {
        const style = document.createElement('style');
        style.id = 'flash-style';
        style.textContent = `
          @keyframes flash-out {
            0% { opacity: 0.15; }
            100% { opacity: 0; }
          }
        `;
        document.head.appendChild(style);
      }
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (['a', 'b', 'c', 'd'].includes(key)) {
        selectOption(key);
      } else if (key === 'r') {
        resetSelection();
      }
    });
  </script>
</body>
</html>
